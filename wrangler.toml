# Cloudflare Pages configuration for draw.instant.
#
# This is a no-build static site: index.html + hand-authored ES modules at the
# repo root. There is nothing to compile, so the "build output directory" is the
# repo root itself. Model weights (*.onnx) are git-ignored and fetched from
# Hugging Face at runtime — they are never deployed (and exceed Pages' 25 MB/file
# limit anyway).
#
# Used by:  npm run deploy   and   .github/workflows/deploy.yml
# See DEPLOY.md for the one-time project-creation steps.

name = "draw-instant"
compatibility_date = "2026-06-25"
pages_build_output_dir = "."
